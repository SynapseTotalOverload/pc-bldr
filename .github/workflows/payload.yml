name: Payload CI/CD

on:
  workflow_dispatch:
  push:
    paths:
      - 'payload/**'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  IMAGE_NAME: payload
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  PAYLOAD_ENVS: $${{ secrets.PAYLOAD_ENVS }}
jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Configure AWS credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # Authenticate Docker to AWS ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # Auth to GCR
    - name: Docker auth
      run: gcloud auth configure-docker --quiet

    # Build and push image
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up enviroment variabled for build
    
      run: |
        echo "${{ env.PAYLOAD_ENVS }}" | base64 --decode > ./payload/.env

    
    - name: Verify .env file
      run: |
        ls -la ./payload/.env
        cat ./payload/.env

    - name: Build and push Docker image
      working-directory: ./payload
      run: |
        docker build -t ${{env.ECR_REGISTRY}}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
        docker push ${{env.ECR_REGISTRY}}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        
    # Deploy on instance
    - name: Deploy to AWS EC2
      env:
        EC2_HOST: ${{ secrets.EC2_PAYLOAD_HOST }}
        EC2_USER: ${{ secrets.EC2_USER }}
        SSH_KEY_BASE64: ${{ secrets.EC2_SSH_KEY_BASE64 }}
      run: |
        echo "$SSH_KEY_BASE64" | base64 --decode > ec2_key.pem
        chmod 600 ec2_key.pem
        FULL_IMAGE_NAME="${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        ssh -i ec2_key.pem -o StrictHostKeyChecking=no ec2-user@$EC2_HOST <<EOF
          docker login -u AWS -p $(aws ecr get-login-password --region $AWS_REGION) $ECR_REGISTRY
          docker pull $FULL_IMAGE_NAME
          docker stop $IMAGE_NAME || true
          docker rm $IMAGE_NAME || true
          docker image prune -af
          sudo docker run -d --network=payload  \
              --name ${{ env.IMAGE_NAME }} \
              --restart=always \
              -v ./media:/app/public/media/ \
              -p 3000:3000 \
              $FULL_IMAGE_NAME 
        EOF



       


        
    
        echo "ip: $PUBLIC_IP:8000" 
