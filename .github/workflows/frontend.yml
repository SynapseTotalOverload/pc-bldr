name: Frontend CI/CD

on:
  workflow_dispatch:
  push:
    paths:
      - 'front-end/**'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  IMAGE_NAME: frontend
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Configure AWS credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # Authenticate Docker to AWS ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # Build and push image
    - name: Build and push Docker image
      working-directory: ./front-end
      env:
        NEXT_PUBLIC_API_URL : ${{ secrets.FRONTEND_API_URL }}
        NEXT_PUBLIC_ADMIN_LOGIN: ${{ secrets.FRONTEND_ADMIN_USERNAME }}
        NEXT_PUBLIC_ADMIN_PASSWORD: ${{ secrets.FRONTEND_ADMIN_PASSWORD }}
      run: |
        echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" > .env.production
        echo "NEXT_PUBLIC_ADMIN_LOGIN=$NEXT_PUBLIC_ADMIN_LOGIN" >> .env.production
        echo "NEXT_PUBLIC_ADMIN_PASSWORD=$NEXT_PUBLIC_ADMIN_PASSWORD" >> .env.production
        docker build -t ${{env.ECR_REGISTRY}}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
        docker push ${{env.ECR_REGISTRY}}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    # Deploy to EC2 instance
    - name: Deploy to AWS EC2
      env:
        EC2_HOST: ${{ secrets.EC2_FRONTEND_HOST }}
        EC2_USER: ${{ secrets.EC2_USER }}
        SSH_KEY_BASE64: ${{ secrets.EC2_SSH_KEY_BASE64 }}
      run: |
        echo "$SSH_KEY_BASE64" | base64 --decode > ec2_key.pem
        chmod 600 ec2_key.pem
        
        FULL_IMAGE_NAME="${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

        ssh -i ec2_key.pem -o StrictHostKeyChecking=no ec2-user@$EC2_HOST <<EOF
          docker login -u AWS -p $(aws ecr get-login-password --region $AWS_REGION) $ECR_REGISTRY
          docker pull $FULL_IMAGE_NAME
          docker stop $IMAGE_NAME || true
          docker rm $IMAGE_NAME || true
          docker image prune -af
          docker run -d \
            --name $IMAGE_NAME \
            --restart=always \
            -p 3000:3000 \
            $FULL_IMAGE_NAME
        EOF

        echo "Deployment complete. App running at http://$EC2_HOST:8000"
